name: Unpack Scratch Guard site

on:
  push:
    paths:
      - ".github/workflows/unpack-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack website
        run: |
          rm -rf /tmp/scratchguard
          mkdir -p /tmp/scratchguard
          unzip -q Scratch-Guard-Git-Ready.zip -d /tmp/scratchguard
          rsync -av --delete             --exclude='.git/'             --exclude='.github/'             --exclude='Scratch-Guard-Git-Ready.zip'             /tmp/scratchguard/scratch-guard-website/ ./
          rm -f Scratch-Guard-Git-Ready.zip

      - name: Commit website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish Scratch Guard website files"
            git push
          fi
